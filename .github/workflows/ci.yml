name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds the static bundle without touching any database (migrations run only on the hosts).
      - run: npm run build:static
      - name: Check the Cloudflare Worker bundles
        run: npx --yes wrangler deploy --dry-run --outdir .wrangler/dry-run
